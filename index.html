  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 cursor: grabbing; }\n\n  /* ===== HUD ===== */\n  .hud {\n    position: absolute;\n    pointer-events: none;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 11px;\n    letter-spacing: 0.04em;\n    color: var(--ink);\n  }\n  .hud .lbl { color: var(--ink-dim); text-transform: uppercase; font-size: 10px; letter-spacing: 0.14em; }\n  .hud .val { color: var(--ink); }\n\n  /* Top-left: mission id */\n  #mission {\n    top: 20px; left: 24px;\n  }\n  #mission .title {\n    font-size: 13px;\n    letter-spacing: 0.24em;\n    color: var(--cyan);\n    font-weight: 600;\n  }\n  #mission .sub {\n    margin-top: 4px;\n    color: var(--ink-dim);\n    font-size: 10px;\n    letter-spacing: 0.18em;\n  }\n\n  /* Top-right: date + day counter */\n  #clock {\n    top: 20px; right: 24px; text-align: right;\n  }\n  #clock .date {\n    font-size: 22px;\n    font-weight: 500;\n    letter-spacing: 0.08em;\n    color: var(--ink);\n    font-variant-numeric: tabular-nums;\n    white-space: nowrap;\n  }\n  #clock .day {\n    margin-top: 6px;\n    color: var(--cyan);\n    font-size: 11px;\n    letter-spacing: 0.18em;\n    white-space: nowrap;\n  }\n  #clock .utc {\n    margin-top: 2px;\n    color: var(--ink-dim);\n    font-size: 10px;\n    letter-spacing: 0.14em;\n  }\n\n  /* Bottom-left: legend + stats */\n  /* Left-justified. Each section can be its own width — Constellation stays narrow,\n     Cumulative Coverage gets more room to breathe. */\n  #legend {\n    bottom: 100px; left: 24px;\n    width: 260px;\n    text-align: left;\n  }\n  #legend .section {\n    margin-bottom: 14px;\n  }\n  #legend .section.constellation { width: 150px; }\n  #legend .section.coverage      { width: 260px; }\n  #legend .section-title {\n    color: var(--ink-dim);\n    font-size: 10px;\n    letter-spacing: 0.2em;\n    text-transform: uppercase;\n    margin-bottom: 8px;\n    padding-bottom: 4px;\n    border-bottom: 1px solid var(--line);\n  }\n  .legend-row {\n    display:flex; align-items:center; gap:10px;\n    padding: 4px 0;\n    font-size: 11px;\n  }\n  .legend-swatch {\n    width: 22px; height: 8px;\n    border-radius: 1px;\n    flex-shrink: 0;\n  }\n  .legend-label { color: var(--ink); white-space: nowrap; }\n  .legend-meta { color: var(--ink-dim); margin-left: auto; font-variant-numeric: tabular-nums; }\n  #legend .cov-main {\n    display:flex; align-items:baseline; gap:10px; padding: 2px 0;\n  }\n\n  /* Sun indicator — floats at the projected direction of the sun, clamped to viewport edge */\n  #sun-indicator {\n    position: absolute;\n    pointer-events: none;\n    transform: translate(-50%, -50%);\n    display: flex; align-items: center; gap: 8px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.2em;\n    color: #ffd98a;\n    text-shadow: 0 0 8px rgba(255, 200, 100, 0.5);\n    z-index: 3;\n    transition: opacity 0.3s;\n  }\n  #sun-indicator .sun-dot {\n    width: 14px; height: 14px;\n    border-radius: 50%;\n    background: radial-gradient(circle, #fff6c8 0%, #ffd98a 40%, rgba(255,200,100,0) 70%);\n    box-shadow:\n      0 0 12px 2px rgba(255, 210, 120, 0.7),\n      0 0 28px 8px rgba(255, 180, 80, 0.25);\n  }\n  #sun-indicator.on-right { flex-direction: row-reverse; }\n\n  /* Bottom-right: telemetry */\n  #telemetry {\n    bottom: 100px; right: 24px;\n    text-align: right;\n    width: 200px;\n  }\n  .tel-row {\n    display:flex; justify-content: flex-end; align-items: baseline; gap: 10px;\n    padding: 3px 0;\n    font-size: 11px;\n  }\n  .tel-row .lbl { font-size: 9px; }\n  .tel-row .val { font-variant-numeric: tabular-nums; min-width: 90px; text-align: right; }\n  .tel-row .val.accent { color: var(--cyan); }\n\n  /* Bottom bar: scrubber */\n  #transport {\n    position: absolute;\n    left: 50%; bottom: 22px;\n    transform: translateX(-50%);\n    width: min(760px, calc(100% - 48px));\n    display: flex;\n    align-items: center;\n    gap: 14px;\n    padding: 12px 16px;\n    background: var(--panel);\n    border: 1px solid var(--panel-border);\n    border-radius: 4px;\n    backdrop-filter: blur(10px);\n    pointer-events: auto;\n    font-family: 'JetBrains Mono', monospace;\n  }\n  .btn {\n    background: transparent;\n    border: 1px solid var(--panel-border);\n    color: var(--ink);\n    font-family: inherit;\n    font-size: 11px;\n    letter-spacing: 0.14em;\n    padding: 7px 12px;\n    border-radius: 2px;\n    cursor: pointer;\n    transition: all 120ms ease;\n    text-transform: uppercase;\n  }\n  .btn:hover { border-color: var(--cyan); color: var(--cyan); }\n  .btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(91,227,255,0.06); }\n  .btn.play { min-width: 68px; }\n\n  .scrubber-wrap {\n    flex: 1;\n    display: flex;\n    align-items: center;\n    gap: 12px;\n  }\n  .scrubber {\n    position: relative;\n    flex: 1;\n    height: 24px;\n    cursor: pointer;\n  }\n  .scrubber-track {\n    position: absolute;\n    top: 50%; transform: translateY(-50%);\n    left: 0; right: 0;\n    height: 2px;\n    background: rgba(120,160,200,0.18);\n    border-radius: 1px;\n  }\n  .scrubber-fill {\n    position: absolute;\n    top: 50%; transform: translateY(-50%);\n    left: 0;\n    height: 2px;\n    background: var(--cyan);\n    box-shadow: 0 0 6px var(--cyan);\n    border-radius: 1px;\n    pointer-events: none;\n  }\n  .scrubber-thumb {\n    position: absolute;\n    top: 50%;\n    width: 10px; height: 10px;\n    background: var(--cyan);\n    border-radius: 50%;\n    transform: translate(-50%, -50%);\n    box-shadow: 0 0 10px var(--cyan);\n    pointer-events: none;\n  }\n  /* day ticks */\n  .scrubber-ticks {\n    position: absolute;\n    top: 50%; transform: translateY(-50%);\n    left: 0; right: 0; height: 10px;\n    pointer-events: none;\n  }\n  .scrubber-ticks .tick {\n    position: absolute;\n    top: 50%; transform: translate(-50%, -50%);\n    width: 1px; height: 6px;\n    background: rgba(120,160,200,0.25);\n  }\n  .scrubber-ticks .tick.major {\n    height: 10px;\n    background: rgba(120,160,200,0.5);\n  }\n\n  .speed-ctl { display: flex; align-items: center; gap: 8px; }\n  .speed-ctl .lbl { font-size: 9px; color: var(--ink-dim); letter-spacing: 0.18em; text-transform: uppercase; }\n  .speed-ctl input[type=range] {\n    -webkit-appearance: none; appearance: none;\n    width: 90px; height: 2px; background: rgba(120,160,200,0.2);\n    outline: none; border-radius: 1px;\n  }\n  .speed-ctl input[type=range]::-webkit-slider-thumb {\n    -webkit-appearance: none; appearance: none;\n    width: 10px; height: 10px; border-radius: 50%;\n    background: var(--cyan); cursor: pointer;\n    box-shadow: 0 0 6px var(--cyan);\n  }\n  .speed-ctl input[type=range]::-moz-range-thumb {\n    width: 10px; height: 10px; border-radius: 50%;\n    background: var(--cyan); cursor: pointer; border: none;\n  }\n  .speed-val { font-size: 11px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }\n\n  /* Tweaks panel */\n  #tweaks {\n    position: absolute;\n    top: 80px; right: 24px;\n    width: 260px;\n    background: var(--panel);\n    border: 1px solid var(--panel-border);\n    border-radius: 4px;\n    backdrop-filter: blur(10px);\n    padding: 14px 16px;\n    display: none;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 11px;\n    pointer-events: auto;\n  }\n  #tweaks.on { display: block; }\n  #tweaks h3 {\n    margin: 0 0 12px 0;\n    font-size: 10px;\n    color: var(--cyan);\n    letter-spacing: 0.24em;\n    font-weight: 600;\n    text-transform: uppercase;\n    padding-bottom: 6px;\n    border-bottom: 1px solid var(--line);\n  }\n  .tweak-row {\n    display:flex; align-items:center; justify-content: space-between;\n    padding: 8px 0;\n    gap: 10px;\n  }\n  .tweak-row .lbl { color: var(--ink-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; }\n  .tweak-row .ctrl { display: flex; align-items: center; gap: 8px; }\n  .seg { display: inline-flex; border: 1px solid var(--panel-border); border-radius: 2px; overflow: hidden; }\n  .seg button {\n    background: transparent; border: none; color: var(--ink-dim);\n    font-family: inherit; font-size: 10px; padding: 5px 9px;\n    cursor: pointer; border-right: 1px solid var(--panel-border);\n  }\n  .seg button:last-child { border-right: none; }\n  .seg button.on { background: rgba(91,227,255,0.1); color: var(--cyan); }\n  .swatches { display: flex; gap: 6px; }\n  .swatch {\n    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;\n    border: 1px solid rgba(255,255,255,0.08);\n  }\n  .swatch.on { box-shadow: 0 0 0 2px var(--ink); }\n  input[type=range].slim {\n    -webkit-appearance: none; appearance: none;\n    width: 100px; height: 2px; background: rgba(120,160,200,0.2);\n    border-radius: 1px;\n  }\n  input[type=range].slim::-webkit-slider-thumb {\n    -webkit-appearance: none; appearance: none;\n    width: 9px; height: 9px; border-radius: 50%;\n    background: var(--cyan); cursor: pointer;\n  }\n  input[type=range].slim::-moz-range-thumb {\n    width: 9px; height: 9px; border-radius: 50%;\n    background: var(--cyan); cursor: pointer; border: none;\n  }\n\n  .vignette {\n    position: absolute; inset: 0;\n    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);\n    pointer-events: none;\n  }\n\n  /* subtle crosshair */\n  .crosshair {\n    position: absolute; top: 50%; left: 50%;\n    width: 12px; height: 12px;\n    transform: translate(-50%,-50%);\n    pointer-events: none;\n    opacity: 0.15;\n  }\n  .crosshair::before, .crosshair::after {\n    content: ''; position: absolute; background: var(--cyan);\n  }\n  .crosshair::before { top: 50%; left: 0; right: 0; height: 1px; }\n  .crosshair::after { left: 50%; top: 0; bottom: 0; width: 1px; }\n\n  /* Corner ticks */\n  .corner {\n    position: absolute; width: 14px; height: 14px;\n    border-color: var(--cyan-dim); opacity: 0.4;\n  }\n  .corner.tl { top: 12px; left: 12px; border-top: 1px solid; border-left: 1px solid; }\n  .corner.tr { top: 12px; right: 12px; border-top: 1px solid; border-right: 1px solid; }\n  .corner.bl { bottom: 12px; left: 12px; border-bottom: 1px solid; border-left: 1px solid; }\n  .corner.br { bottom: 12px; right: 12px; border-bottom: 1px solid; border-right: 1px solid; }\n<\u002Fstyle>\n\n<!-- tweak defaults persisted on disk -->\n<script>\nwindow.__TWEAKS = /*EDITMODE-BEGIN*/{\n  \"s2aColor\": \"#ff5a8a\",\n  \"s2bColor\": \"#b478ff\",\n  \"satCount\": 2,\n  \"showSwath\": true,\n  \"globeSpinSpeed\": 0\n}/*EDITMODE-END*/;\n<\u002Fscript>\n<\u002Fhead>\n<body>\n<div id=\"app\">\n  <canvas id=\"scene\"><\u002Fcanvas>\n  <div class=\"vignette\"><\u002Fdiv>\n  <div class=\"crosshair\"><\u002Fdiv>\n\n  <div class=\"corner tl\"><\u002Fdiv>\n  <div class=\"corner tr\"><\u002Fdiv>\n  <div class=\"corner bl\"><\u002Fdiv>\n  <div class=\"corner br\"><\u002Fdiv>\n\n  <div class=\"hud\" id=\"mission\">\n    <div class=\"title\">SENTINEL-2 · MSI<\u002Fdiv>\n    <div class=\"sub\">COPERNICUS / SUN-SYNCHRONOUS<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"hud\" id=\"clock\">\n    <div class=\"date\" id=\"date-str\">—<\u002Fdiv>\n    <div class=\"day\" id=\"day-str\">DAY 00 / 30<\u002Fdiv>\n    <div class=\"utc\" id=\"utc-str\">00:00:00 UTC<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"sun-indicator\"><div class=\"sun-dot\"><\u002Fdiv><div class=\"sun-label\">SUN<\u002Fdiv><\u002Fdiv>\n\n  <div class=\"hud\" id=\"legend\">\n    <div class=\"section constellation\">\n      <div class=\"section-title\">Constellation<\u002Fdiv>\n      <div id=\"legend-rows\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"section coverage\">\n      <div class=\"section-title\">Cumulative Coverage<\u002Fdiv>\n      <div class=\"cov-main\">\n        <div style=\"font-size: 28px; font-weight: 500; color: var(--cyan); font-variant-numeric: tabular-nums;\" id=\"cov-pct\">0.0<span style=\"font-size:14px; color: var(--ink-dim); margin-left: 2px;\">%<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 10px; color: var(--ink-dim); letter-spacing: 0.14em;\">OF LAND SURFACE<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative; height: 4px; background: rgba(120,160,200,0.12); margin-top: 8px; border-radius: 1px;\">\n        <div id=\"cov-bar\" style=\"position:absolute; left:0; top:0; bottom:0; width:0%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); border-radius: 1px;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"hud\" id=\"telemetry\">\n    <div class=\"section-title\" style=\"color: var(--ink-dim); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); text-align: right;\">Orbit Parameters<\u002Fdiv>\n    <div class=\"tel-row\"><span class=\"lbl\">ALT<\u002Fspan><span class=\"val\">786.000 KM<\u002Fspan><\u002Fdiv>\n    <div class=\"tel-row\"><span class=\"lbl\">INC<\u002Fspan><span class=\"val\">98.62°<\u002Fspan><\u002Fdiv>\n    <div class=\"tel-row\"><span class=\"lbl\">PER<\u002Fspan><span class=\"val\">100.60 MIN<\u002Fspan><\u002Fdiv>\n    <div class=\"tel-row\"><span class=\"lbl\">LTDN<\u002Fspan><span class=\"val\">10:30<\u002Fspan><\u002Fdiv>\n    <div class=\"tel-row\"><span class=\"lbl\">SWATH<\u002Fspan><span class=\"val\">290 KM<\u002Fspan><\u002Fdiv>\n    <div class=\"tel-row\" style=\"margin-top:10px; padding-top:10px; border-top: 1px solid var(--line);\"><span class=\"lbl\">ORBITS/DAY<\u002Fspan><span class=\"val accent\" id=\"orbits-per-day\">14.31<\u002Fspan><\u002Fdiv>\n    <div class=\"tel-row\"><span class=\"lbl\">TOTAL ORBITS<\u002Fspan><span class=\"val accent\" id=\"total-orbits\">0<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"transport\">\n    <button class=\"btn play\" id=\"btn-play\">PAUSE<\u002Fbutton>\n    <div class=\"scrubber-wrap\">\n      <div class=\"scrubber\" id=\"scrubber\">\n        <div class=\"scrubber-track\"><\u002Fdiv>\n        <div class=\"scrubber-ticks\" id=\"ticks\"><\u002Fdiv>\n        <div class=\"scrubber-fill\" id=\"scrub-fill\"><\u002Fdiv>\n        <div class=\"scrubber-thumb\" id=\"scrub-thumb\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"speed-ctl\">\n      <span class=\"lbl\">Speed<\u002Fspan>\n      <input type=\"range\" id=\"speed\" min=\"0.5\" max=\"20\" step=\"0.5\" value=\"0.5\">\n      <span class=\"speed-val\" id=\"speed-val\">0.5×<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"tweaks\">\n    <h3>Tweaks<\u002Fh3>\n    <div class=\"tweak-row\">\n      <span class=\"lbl\">Satellites<\u002Fspan>\n      <div class=\"ctrl\">\n        <div class=\"seg\" id=\"sat-count\">\n          <button data-v=\"1\">1<\u002Fbutton>\n          <button data-v=\"2\" class=\"on\">2<\u002Fbutton>\n          <button data-v=\"3\">3<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tweak-row\">\n      <span class=\"lbl\">S-2A Track<\u002Fspan>\n      <div class=\"swatches\" id=\"s2a-swatches\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tweak-row\">\n      <span class=\"lbl\">S-2B Track<\u002Fspan>\n      <div class=\"swatches\" id=\"s2b-swatches\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tweak-row\">\n      <span class=\"lbl\">Swath Fill<\u002Fspan>\n      <div class=\"seg\" id=\"swath-toggle\">\n        <button data-v=\"1\" class=\"on\">ON<\u002Fbutton>\n        <button data-v=\"0\">OFF<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tweak-row\">\n      <span class=\"lbl\">Spin Speed<\u002Fspan>\n      <div class=\"ctrl\">\n        <input type=\"range\" class=\"slim\" id=\"spin-speed\" min=\"0\" max=\"3\" step=\"0.1\" value=\"1\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"ca0f448c-5bf6-4261-b3a1-cf094c3cb10e\"><\u002Fscript>\n<script src=\"f2fbb73c-736b-4b39-a945-75b079f7ca75\"><\u002Fscript>\n<script>\n// Low-res world coastline data as lat/lon polylines, simplified.\n// Generated from Natural Earth 110m, aggressively simplified for wireframe look.\n// Format: array of arrays of [lon, lat] pairs.\n// This is a compact hand-curated simplified set sufficient for a glowing-globe wireframe.\n// Continents: Africa, Eurasia, Americas, Australia, Antarctica (approx)\n\nlet COASTLINES = [];\n\n// ============================================================\n// Sentinel-2 orbit parameters\n// ============================================================\nconst R_EARTH = 6371;          // km\nconst ALT = 786;               // km\nconst R_ORB = R_EARTH + ALT;\nconst INC = 98.62 * Math.PI/180;   // inclination, rad\nconst PERIOD_MIN = 100.60;         // orbital period, minutes\nconst SWATH_KM = 290;              // swath width\nconst EARTH_ROT_PER_DAY = 2*Math.PI; // rad/day (sidereal approx; good enough)\n// Sun-sync: node drifts ~0.9856°/day (= 360°/365.25) so orbit plane keeps pace with sun.\nconst NODE_DRIFT_PER_DAY = (2*Math.PI) / 365.25;\n\n// Globe visual radius (unitless)\nconst R_VIS = 1.0;\nconst ORBIT_VIS = R_VIS * (R_ORB / R_EARTH);\n\n// ============================================================\n// Setup\n// ============================================================\nconst canvas = document.getElementById('scene');\nconst renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\nrenderer.setClearColor(0x05070a, 1);\n\nconst scene = new THREE.Scene();\n\nconst camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);\ncamera.position.set(0, 0, 3.2);\ncamera.lookAt(0,0,0);\n\n// Root that user can drag-rotate\nconst world = new THREE.Group();\nscene.add(world);\n\n// ============================================================\n// Globe: dark sphere backing + glow + graticule + coastlines\n// ============================================================\n\n// Dark sphere (slightly tinted so it reads as 3D even without lighting)\nconst globeGeom = new THREE.SphereGeometry(R_VIS * 0.999, 64, 64);\nconst globeMat = new THREE.MeshBasicMaterial({ color: 0x0a1016 });\nconst globeMesh = new THREE.Mesh(globeGeom, globeMat);\nworld.add(globeMesh);\n\n// Soft limb glow (two additive back-facing spheres)\nfunction makeGlow(radius, color, opacity) {\n  const geo = new THREE.SphereGeometry(radius, 48, 48);\n  const mat = new THREE.ShaderMaterial({\n    transparent: true,\n    blending: THREE.AdditiveBlending,\n    side: THREE.BackSide,\n    depthWrite: false,\n    uniforms: { uColor: { value: new THREE.Color(color) }, uOpacity: { value: opacity } },\n    vertexShader: `\n      varying float vRim;\n      void main() {\n        vec3 vN = normalize(normalMatrix * normal);\n        vec3 vP = normalize(-(modelViewMatrix * vec4(position,1.0)).xyz);\n        vRim = pow(1.0 - max(dot(vN, vP), 0.0), 2.2);\n        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);\n      }`,\n    fragmentShader: `\n      uniform vec3 uColor;\n      uniform float uOpacity;\n      varying float vRim;\n      void main() { gl_FragColor = vec4(uColor, vRim * uOpacity); }`\n  });\n  return new THREE.Mesh(geo, mat);\n}\nworld.add(makeGlow(R_VIS * 1.04, 0x5be3ff, 0.45));\nworld.add(makeGlow(R_VIS * 1.12, 0x2a8fb0, 0.18));\n\n// Graticule (lat/lon lines)\nfunction addGraticule() {\n  const group = new THREE.Group();\n  const mat = new THREE.LineBasicMaterial({ color: 0x2d4a60, transparent:true, opacity:0.18 });\n  const matEq = new THREE.LineBasicMaterial({ color: 0x5be3ff, transparent:true, opacity:0.35 });\n\n  // parallels\n  for (let lat = -80; lat <= 80; lat += 20) {\n    const pts = [];\n    for (let lon = -180; lon <= 180; lon += 3) {\n      pts.push(latlonToVec3(lat, lon, R_VIS * 1.001));\n    }\n    const g = new THREE.BufferGeometry().setFromPoints(pts);\n    group.add(new THREE.Line(g, lat===0 ? matEq : mat));\n  }\n  // meridians\n  for (let lon = -180; lon < 180; lon += 20) {\n    const pts = [];\n    for (let lat = -90; lat <= 90; lat += 3) {\n      pts.push(latlonToVec3(lat, lon, R_VIS * 1.001));\n    }\n    const g = new THREE.BufferGeometry().setFromPoints(pts);\n    group.add(new THREE.Line(g, mat));\n  }\n  return group;\n}\nworld.add(addGraticule());\n\n// Coastlines\nconst coastGroup = new THREE.Group();\nasync function loadCoastlines() {\n  try {\n    const resp = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json');\n    const topo = await resp.json();\n    const geo = topojson.feature(topo, topo.objects.land);\n    const matGlow = new THREE.LineBasicMaterial({ color: 0xffffff, transparent:true, opacity:0.22 });\n    const mat = new THREE.LineBasicMaterial({ color: 0xeaf6ff, transparent:true, opacity:1.0 });\n    function addRing(ring) {\n      const ptsInner = ring.map(([lon, lat]) => latlonToVec3(lat, lon, R_VIS * 1.003));\n      const ptsGlow = ring.map(([lon, lat]) => latlonToVec3(lat, lon, R_VIS * 1.0035));\n      const gI = new THREE.BufferGeometry().setFromPoints(ptsInner);\n      const gG = new THREE.BufferGeometry().setFromPoints(ptsGlow);\n      coastGroup.add(new THREE.Line(gG, matGlow));\n      coastGroup.add(new THREE.Line(gI, mat));\n    }\n    function walk(geom) {\n      if (!geom) return;\n      if (geom.type === 'Polygon') geom.coordinates.forEach(addRing);\n      else if (geom.type === 'MultiPolygon') geom.coordinates.forEach(polys => polys.forEach(addRing));\n      else if (geom.type === 'GeometryCollection') geom.geometries.forEach(walk);\n      else if (geom.features) geom.features.forEach(f => walk(f.geometry));\n      else walk(geom.geometry);\n    }\n    walk(geo);\n    // Also load country borders for detail\n    const resp2 = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');\n    const topo2 = await resp2.json();\n    const meshGeo = topojson.mesh(topo2, topo2.objects.countries, (a, b) => a !== b);\n    const borderMat = new THREE.LineBasicMaterial({ color: 0x6a90a8, transparent:true, opacity:0.45 });\n    if (meshGeo.type === 'MultiLineString') {\n      meshGeo.coordinates.forEach(line => {\n        const pts = line.map(([lon, lat]) => latlonToVec3(lat, lon, R_VIS * 1.0028));\n        const g = new THREE.BufferGeometry().setFromPoints(pts);\n        coastGroup.add(new THREE.Line(g, borderMat));\n      });\n    }\n  } catch (e) {\n    console.error('coastline load failed', e);\n  }\n}\nloadCoastlines();\nfunction addCoastlines() { return coastGroup; }\nworld.add(addCoastlines());\n\nfunction latlonToVec3(latDeg, lonDeg, r) {\n  const lat = latDeg * Math.PI/180;\n  const lon = lonDeg * Math.PI/180;\n  return new THREE.Vector3(\n     r * Math.cos(lat) * Math.cos(lon),\n     r * Math.sin(lat),\n     -r * Math.cos(lat) * Math.sin(lon)\n  );\n}\nfunction vec3ToLatLon(v) {\n  const r = v.length();\n  const lat = Math.asin(v.y / r) * 180/Math.PI;\n  const lon = Math.atan2(-v.z, v.x) * 180/Math.PI;\n  return [lat, lon];\n}\n\n// ============================================================\n// Swath canvas — painted as a texture and wrapped on a thin shell\n// ============================================================\nconst SWATH_CANVAS_W = 2048;\nconst SWATH_CANVAS_H = 1024;\nconst swathCanvas = document.createElement('canvas');\nswathCanvas.width = SWATH_CANVAS_W;\nswathCanvas.height = SWATH_CANVAS_H;\nconst sctx = swathCanvas.getContext('2d');\nsctx.clearRect(0,0,SWATH_CANVAS_W,SWATH_CANVAS_H);\n\nconst swathTex = new THREE.CanvasTexture(swathCanvas);\nswathTex.colorSpace = THREE.SRGBColorSpace;\n\nconst swathGeom = new THREE.SphereGeometry(R_VIS * 1.0035, 128, 128);\nconst swathMat = new THREE.MeshBasicMaterial({\n  map: swathTex, transparent:true, opacity: 1.0, depthWrite:false\n});\nconst swathMesh = new THREE.Mesh(swathGeom, swathMat);\nworld.add(swathMesh);\n\n// Convert lat/lon to canvas pixel (equirectangular, lon wrapping)\n// Three.js SphereGeometry default UV: u = 1 - (atan2(z,x)/(2π)+0.5) ...\n// We'll use the standard mapping where u=0 at lon=180 (anti-meridian) going east.\n// After experimentation with Three default: at position (x,y,z), u = 0.5 - atan2(z,x)/(2π), v = 0.5 - asin(y/r)/π\n// We will paint into the canvas using the same formula.\nfunction latlonToCanvas(latDeg, lonDeg) {\n  // Three's sphere: texture seam at lon=+180 (x=-1 direction when z=0). Our latlonToVec3 uses -sin(lon) for z.\n  // Check: position = (cos(lat)cos(lon), sin(lat), -cos(lat)sin(lon))\n  // u = 0.5 - atan2(z,x)/(2π) = 0.5 - atan2(-cos(lat)sin(lon), cos(lat)cos(lon))/(2π)\n  //   = 0.5 - atan2(-sin(lon), cos(lon))/(2π) = 0.5 + lon/(2π)\n  // v = 0.5 - asin(y/r)/π = 0.5 - lat/π\n  const u = 0.5 + lonDeg/360;\n  const v = 0.5 - latDeg/180;\n  return [u * SWATH_CANVAS_W, v * SWATH_CANVAS_H];\n}\n\n// ============================================================\n// Orbit math\n// ============================================================\n// State: for each satellite, given time t (days from epoch):\n//   mean anomaly (rad): M = 2π * (t_minutes / PERIOD_MIN) + phase\n//   RAAN (right ascension of ascending node, rad): Ω = Ω₀ + NODE_DRIFT_PER_DAY * t_days\n//   position in ECI: rotate (R_ORB along orbital plane defined by inc + RAAN)\n//   Earth rotation: θ = EARTH_ROT_PER_DAY * t_days + θ₀\n//   sub-point in ECEF (earth-fixed) lat/lon = ECI - θ about y-axis.\n\nfunction satellitePosECI(tDays, raan0, phase0) {\n  const tMin = tDays * 1440;\n  const M = (2*Math.PI) * (tMin / PERIOD_MIN) + phase0;   // rad\n  const raan = raan0 + NODE_DRIFT_PER_DAY * tDays;\n  // Position in orbital plane (perifocal, circular): (R*cosM, R*sinM, 0)\n  const x_p = R_ORB * Math.cos(M);\n  const y_p = R_ORB * Math.sin(M);\n  // Rotate by inclination about x-axis: (x_p, y_p*cos(i), y_p*sin(i))\n  const xi = x_p;\n  const yi = y_p * Math.cos(INC);\n  const zi = y_p * Math.sin(INC);\n  // Rotate by RAAN about z-axis\n  const cO = Math.cos(raan), sO = Math.sin(raan);\n  const xe = xi*cO - yi*sO;\n  const ye = xi*sO + yi*cO;\n  const ze = zi;\n  return [xe, ye, ze]; // ECI\n}\n\n// Convert ECI (z-up, x toward vernal equinox) to our \"geo\" lat/lon at time t\nfunction eciToLatLon(eci, tDays) {\n  const theta = EARTH_ROT_PER_DAY * tDays; // sidereal rotation\n  const cT = Math.cos(theta), sT = Math.sin(theta);\n  // Rotate ECI to ECEF (about z by -theta)\n  const xf = eci[0]*cT + eci[1]*sT;\n  const yf = -eci[0]*sT + eci[1]*cT;\n  const zf = eci[2];\n  const r = Math.hypot(xf, yf, zf);\n  const lat = Math.asin(zf / r) * 180/Math.PI;\n  const lon = Math.atan2(yf, xf) * 180/Math.PI;\n  return { lat, lon, altKm: r - R_EARTH };\n}\n\n// Sub-satellite point (on ground)\nfunction groundTrackLatLon(tDays, raan0, phase0) {\n  const eci = satellitePosECI(tDays, raan0, phase0);\n  return eciToLatLon(eci, tDays);\n}\n\n// Is a sub-satellite point currently illuminated (day side)?\n// Sun direction in ECI at time t: simple model, sun moves 360°/year along x-y plane ignoring tilt\n// For this viz we approximate: sun longitude in ECI drifts, but for determining daylight we use\n// subsolar point in ECEF.\nfunction subSolarLonECEF(tDays) {\n  // At UTC 00:00 subsolar longitude is 180° (sun on anti-Greenwich meridian).\n  // Subsolar lon (deg) = 180 - 15 * utcHours\n  const utcHours = (tDays * 24) % 24;\n  let lon = 180 - 15 * utcHours;\n  lon = ((lon + 540) % 360) - 180;\n  return lon;\n}\nfunction isDaylit(lat, lon, tDays) {\n  const sunLon = subSolarLonECEF(tDays);\n  const sunLat = 0; // ignoring axial tilt for simplicity\n  // angle between (lat,lon) and (sunLat,sunLon)\n  const toRad = Math.PI/180;\n  const cosAngle = Math.sin(lat*toRad)*Math.sin(sunLat*toRad) +\n                   Math.cos(lat*toRad)*Math.cos(sunLat*toRad)*Math.cos((lon-sunLon)*toRad);\n  return cosAngle > -0.10; // include slight twilight margin\n}\n\n// ============================================================\n// Satellites — visible markers\n// ============================================================\nconst sats = [\n  // S-2A and S-2B are on the same sun-sync orbit, 180° out of phase (true constellation config)\n  { id: 'S-2B', color: window.__TWEAKS.s2bColor, raan0: 0.0,            phase0: Math.PI },\n  { id: 'S-2A', color: window.__TWEAKS.s2aColor, raan0: 0.0,            phase0: 0.0 },\n  { id: 'S-2C', color: '#b478ff',                 raan0: 0.0,           phase0: Math.PI*0.5 }\n];\n\nconst satGroup = new THREE.Group();\nworld.add(satGroup);\n\nconst satMeshes = sats.map(s => {\n  const g = new THREE.Group();\n  // Glowing dot\n  const dotGeo = new THREE.SphereGeometry(0.014, 16, 16);\n  const dotMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(s.color) });\n  const dot = new THREE.Mesh(dotGeo, dotMat);\n  g.add(dot);\n  // Halo\n  const haloGeo = new THREE.SphereGeometry(0.028, 16, 16);\n  const haloMat = new THREE.ShaderMaterial({\n    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,\n    uniforms: { uColor: { value: new THREE.Color(s.color) } },\n    vertexShader: `varying float vD; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vD = 1.0 - length(position)/0.028; gl_Position = projectionMatrix*mv; }`,\n    fragmentShader: `uniform vec3 uColor; varying float vD; void main(){ gl_FragColor=vec4(uColor, pow(max(vD,0.0),2.0)*0.55); }`\n  });\n  g.add(new THREE.Mesh(haloGeo, haloMat));\n\n  // Down-line to nadir\n  const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);\n  const lineMat = new THREE.LineBasicMaterial({ color: new THREE.Color(s.color), transparent:true, opacity:0.35 });\n  const nadirLine = new THREE.Line(lineGeo, lineMat);\n  satGroup.add(nadirLine);\n\n  satGroup.add(g);\n  return { group: g, dot, halo: g.children[1], dotMat, haloMat, nadirLine };\n});\n\n// Orbit trail (fading ring of recent positions per sat)\nconst trailMeshes = sats.map(s => {\n  const N = 160;\n  const positions = new Float32Array(N*3);\n  const colors = new Float32Array(N*3);\n  const geo = new THREE.BufferGeometry();\n  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));\n  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));\n  const mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent:true, opacity:0.9 });\n  const line = new THREE.Line(geo, mat);\n  satGroup.add(line);\n  return { line, positions, colors, N, head: 0, filled: 0 };\n});\n\n// ============================================================\n// Simulation state\n// ============================================================\nconst SIM_DAYS = 8;\nconst EPOCH = new Date('2026-04-01T00:00:00Z');\nlet simTimeDays = 0;\nlet playing = true;\nlet speed = 0.5; // real-seconds per sim-hour? No — \"days per real-second\" via this multiplier\n// At speed=1, we want 1 real-second = (30 days / 60 real-seconds) = 0.5 sim-days per sec → baseline\n// So sim seconds per real sec = speed * 0.5 sim-days/sec\nconst BASE_DAYS_PER_SEC = 30 / 90; // full month in 90 real seconds at speed=1 (~too slow?)\n// Actually: user chose slider 0.5x–20x, default 3x. Let's say at 1x a month plays in 120s; default 3x → 40s.\nconst DAYS_PER_SEC_AT_1X = SIM_DAYS / 120;\n\n// Track last-painted sub-point per satellite so we can draw swath polygons (thick strips)\nconst lastSub = sats.map(() => null);\nconst lastPaintDays = sats.map(() => null);\n// Coverage counting\nlet coverageLandPct = 0;\nlet paintedPixelsLand = 0;\nconst LAND_PIXELS_TOTAL = estimateLandPixels(); // rough denominator\n\nfunction estimateLandPixels() {\n  // Very rough: ~29% of Earth is land. With our canvas 2048x1024 and equirectangular,\n  // surface area per pixel depends on latitude (cos(lat)), so true-area land ratio ≈ 29%.\n  // We want coverage = area-weighted. We'll compute weighted denominator.\n  let total = 0;\n  for (let y=0; y<SWATH_CANVAS_H; y++) {\n    const lat = (0.5 - y/SWATH_CANVAS_H) * 180;\n    total += Math.cos(lat * Math.PI/180) * SWATH_CANVAS_W;\n  }\n  return total * 0.292; // ~29.2% land\n}\n\n// We'll track painted area by keeping a lightweight \"painted\" grid (lower resolution) to avoid per-pixel readback cost.\nconst COV_W = 360, COV_H = 180; // 1° grid\nconst covGrid = new Uint8Array(COV_W * COV_H);\nlet covWeightedPainted = 0;\nlet covWeightedTotal = 0;\nfor (let y=0; y<COV_H; y++) {\n  const lat = (0.5 - y/COV_H) * 180;\n  covWeightedTotal += Math.cos(lat * Math.PI/180) * COV_W;\n}\n// Land mask — we'll approximate \"is land at lat,lon\" by point-in-polygon against coastlines.\n// For cost, we precompute a rough raster land mask by sampling.\nconst landMask = new Uint8Array(COV_W * COV_H); // 1 = land\nbuildLandMask();\n\nfunction buildLandMask() {\n  // Very rough: use a few big bounding boxes for continents so we don't need real polygon tests.\n  // \"Land\" = inside any of these approximate regions.\n  const regions = [\n    // Africa\n    (lat,lon) => lon>-18 && lon<52 && lat>-35 && lat<37 &&\n                 !(lon<15 && lat>30) &&   // trim Mediterranean\n                 !(lon>45 && lat<-10),\n    // Eurasia huge slab\n    (lat,lon) => lon>-10 && lon<180 && lat>10 && lat<75 &&\n                 !(lon<20 && lat<35),      // not into africa\n    // Southeast Asia / Indonesia cluster\n    (lat,lon) => lon>95 && lon<142 && lat>-11 && lat<25,\n    // Australia\n    (lat,lon) => lon>112 && lon<155 && lat>-40 && lat<-10,\n    // North America\n    (lat,lon) => lon>-170 && lon<-52 && lat>14 && lat<72,\n    // Greenland\n    (lat,lon) => lon>-55 && lon<-18 && lat>60 && lat<84,\n    // South America\n    (lat,lon) => lon>-82 && lon<-34 && lat>-56 && lat<13,\n    // Antarctica\n    (lat,lon) => lat < -63,\n    // UK/Ireland\n    (lat,lon) => lon>-11 && lon<3 && lat>50 && lat<61,\n    // Japan\n    (lat,lon) => lon>128 && lon<146 && lat>30 && lat<46,\n    // New Zealand\n    (lat,lon) => lon>165 && lon<179 && lat>-48 && lat<-34,\n    // Madagascar\n    (lat,lon) => lon>42 && lon<51 && lat>-26 && lat<-11,\n  ];\n  for (let y=0; y<COV_H; y++) {\n    const lat = (0.5 - y/COV_H) * 180;\n    for (let x=0; x<COV_W; x++) {\n      const lon = (x/COV_W - 0.5) * 360;\n      const isLand = regions.some(fn => fn(lat, lon));\n      landMask[y*COV_W + x] = isLand ? 1 : 0;\n    }\n  }\n  // Recompute weighted total over LAND only\n  covWeightedTotal = 0;\n  for (let y=0; y<COV_H; y++) {\n    const lat = (0.5 - y/COV_H) * 180;\n    const w = Math.cos(lat * Math.PI/180);\n    for (let x=0; x<COV_W; x++) {\n      if (landMask[y*COV_W + x]) covWeightedTotal += w;\n    }\n  }\n}\n\n// ============================================================\n// Painting the swath\n// ============================================================\n// Approach: for each satellite, each frame, compute current ground point + \"previous\" ground point.\n// Draw a wide line from previous to current with thickness equal to swath width in canvas pixels.\n// Canvas width at equator covers 360° of lon, so pixels per km at equator = SWATH_CANVAS_W / (2π·R_EARTH)\n// Thickness in canvas pixels at a given lat: swath_km * pixelsPerDeg_lon * (1/cos(lat))\n// Simpler: stroke width at equator = SWATH_KM / (earthCircumference/SWATH_CANVAS_W).\nconst EARTH_CIRCUM_KM = 2*Math.PI*R_EARTH;  // ~40030\nconst PX_PER_KM_EQ = SWATH_CANVAS_W / EARTH_CIRCUM_KM;  // ~0.05\n\nfunction paintSwathSegment(satIdx, p1, p2, colorHex, tDays) {\n  if (!p1 || !p2) return;\n  // Rebase guard — massive latitude jumps mean the paint head was just reset\n  if (Math.abs(p1.lat - p2.lat) > 45) return;\n\n  // Antimeridian wrap: if the segment crosses ±180°, draw it three times with ±canvas-width\n  // x-offsets. Whichever copy lies inside the canvas becomes a continuous stroke; clipping hides\n  // the others. This is seamless — no line cap or anti-aliased gap at the seam.\n  const dLon = p2.lon - p1.lon;\n  const wraps = Math.abs(dLon) > 180;\n  const dLonShort = wraps ? (dLon - 360 * Math.sign(dLon)) : dLon;\n\n  // Day-side only (Sentinel-2 MSI is passive).\n  // Compute midpoint along the short-way longitude delta, then re-wrap.\n  const midLat = (p1.lat + p2.lat)/2;\n  let   midLon = p1.lon + dLonShort * 0.5;\n  midLon = ((midLon + 540) % 360) - 180;\n  if (!isDaylit(midLat, midLon, tDays)) return;\n\n  const [x1, y1] = latlonToCanvas(p1.lat, p1.lon);\n  let   [x2, y2] = latlonToCanvas(p2.lat, p2.lon);\n\n  // If the segment wraps the seam, replace x2 with whichever of (x2, x2-W, x2+W) is closest\n  // to x1. That gives us one continuous line that extends off one edge; we then draw a second\n  // copy shifted by ±W so coverage on the other side of the seam is painted too.\n  const W = SWATH_CANVAS_W;\n  let x2b = null;\n  if (wraps) {\n    const cands = [x2, x2 - W, x2 + W];\n    x2 = cands.reduce((best, c) => Math.abs(c - x1) < Math.abs(best - x1) ? c : best);\n    // Mirror copy on the other side of the canvas\n    x2b = x2 + (x2 > x1 ? -W : W);\n  }\n\n  // Thickness: perpendicular to motion, ~290 km\n  // At latitude lat, 1° lon ≈ 111 km · cos(lat). Canvas pixel per °lat = SWATH_CANVAS_H/180.\n  // Use geometric-mean approach: compute swath half-width in pixels at mid lat for lat-direction\n  const pxPerDegLat = SWATH_CANVAS_H / 180;\n  const pxPerDegLon = SWATH_CANVAS_W / 360;\n  const kmPerDegLat = 111.32;\n  const kmPerDegLon = 111.32 * Math.cos(midLat * Math.PI/180);\n  // We'll stroke with line thickness computed in lat-equivalent pixels (≈ constant since swath is ~perpendicular to track)\n  const swathPx = (SWATH_KM / kmPerDegLat) * pxPerDegLat;\n\n  sctx.save();\n  sctx.globeCompositeOperation = 'source-over';\n  // Helper: stroke from (x1,y1) to (x2,y2) and optionally a mirrored copy at x1±W, x2±W.\n  function strokeLine() {\n    sctx.beginPath();\n    sctx.moveTo(x1, y1); sctx.lineTo(x2, y2);\n    sctx.stroke();\n    if (x2b !== null) {\n      const x1b = x1 + (x2b - x2);\n      sctx.beginPath();\n      sctx.moveTo(x1b, y1); sctx.lineTo(x2b, y2);\n      sctx.stroke();\n    }\n  }\n  // Outer glow\n  sctx.strokeStyle = hexToRGBA(colorHex, 0.18);\n  sctx.lineWidth = swathPx * 1.35;\n  sctx.lineCap = 'round';\n  strokeLine();\n  // Core\n  sctx.strokeStyle = hexToRGBA(colorHex, 0.55);\n  sctx.lineWidth = swathPx;\n  strokeLine();\n  // Bright centerline\n  sctx.strokeStyle = hexToRGBA(colorHex, 0.95);\n  sctx.lineWidth = Math.max(1, swathPx * 0.12);\n  strokeLine();\n  sctx.restore();\n\n  swathTex.needsUpdate = true;\n\n  // Update coverage grid along segment (sample ~every 0.5°). Already computed dLonShort above.\n  const steps = Math.max(4, Math.ceil(Math.hypot(p2.lat-p1.lat, dLonShort)/0.5));\n  const swathHalfDeg = (SWATH_KM/2) / kmPerDegLat;\n  for (let s=0; s<=steps; s++) {\n    const f = s/steps;\n    const lat = p1.lat*(1-f) + p2.lat*f;\n    // Walk along short-way delta then re-wrap\n    let lon = p1.lon + dLonShort * f;\n    lon = ((lon + 540) % 360) - 180;\n    // paint a small box around (lat, lon) at swath width\n    const halfLat = swathHalfDeg;\n    const halfLon = (SWATH_KM/2) / Math.max(10, kmPerDegLon);\n    for (let dLat = -halfLat; dLat <= halfLat; dLat += 1) {\n      for (let dLon = -halfLon; dLon <= halfLon; dLon += 1) {\n        const la = lat + dLat, lo = lon + dLon;\n        if (la < -90 || la > 90) continue;\n        let loo = ((lo + 540) % 360) - 180;\n        const gx = Math.floor((loo/360 + 0.5) * COV_W) % COV_W;\n        const gy = Math.floor((0.5 - la/180) * COV_H);\n        if (gy < 0 || gy >= COV_H) continue;\n        const idx = gy*COV_W + gx;\n        if (landMask[idx] && !covGrid[idx]) {\n          covGrid[idx] = 1;\n          const w = Math.cos(la * Math.PI/180);\n          covWeightedPainted += w;\n        }\n      }\n    }\n  }\n}\n\nfunction hexToRGBA(hex, a) {\n  const h = hex.replace('#','');\n  const r = parseInt(h.substring(0,2),16);\n  const g = parseInt(h.substring(2,4),16);\n  const b = parseInt(h.substring(4,6),16);\n  return `rgba(${r},${g},${b},${a})`;\n}\n\n// ============================================================\n// Update loop\n// ============================================================\nconst clock = new THREE.Clock();\n\nfunction update(dtReal) {\n  if (playing) {\n    const dSim = dtReal * DAYS_PER_SEC_AT_1X * speed;\n    const prevTime = simTimeDays;\n    simTimeDays += dSim;\n    if (simTimeDays >= SIM_DAYS) {\n      simTimeDays = SIM_DAYS;\n      playing = false;\n      updatePlayBtn();\n    }\n    // Deterministic paint: advance each satellite in FIXED 1-minute sim steps until it catches up\n    // to simTimeDays. Total coverage is therefore independent of playback speed or frame rate.\n    const activeSats = getActiveSats();\n    const STEP_MIN = 1.0;\n    const STEP_DAYS = STEP_MIN / 1440;\n    for (let sIdx of activeSats) {\n      if (lastPaintDays[sIdx] === null || lastPaintDays[sIdx] > simTimeDays) {\n        lastPaintDays[sIdx] = simTimeDays;\n        lastSub[sIdx] = groundTrackLatLon(simTimeDays, sats[sIdx].raan0, sats[sIdx].phase0);\n        continue;\n      }\n      // Safety: cap number of steps per frame so huge speed jumps don't stall us\n      let steps = Math.ceil((simTimeDays - lastPaintDays[sIdx]) / STEP_DAYS);\n      steps = Math.min(steps, 4000);\n      for (let k=0; k<steps; k++) {\n        const tk = Math.min(simTimeDays, lastPaintDays[sIdx] + STEP_DAYS);\n        const pt = groundTrackLatLon(tk, sats[sIdx].raan0, sats[sIdx].phase0);\n        if (lastSub[sIdx]) {\n          const col = (sIdx===0) ? window.__TWEAKS.s2bColor\n                    : (sIdx===1) ? window.__TWEAKS.s2aColor\n                    : sats[2].color;\n          if (window.__TWEAKS.showSwath) paintSwathSegment(sIdx, lastSub[sIdx], pt, col, tk);\n        }\n        lastSub[sIdx] = pt;\n        lastPaintDays[sIdx] = tk;\n        if (tk >= simTimeDays) break;\n      }\n    }\n  }\n\n  // Globe spin (Earth rotates under ECI frame). We present ECEF by counter-rotating the globe so\n  // sub-points appear stationary on it. Simpler: keep globe fixed in ECEF and rotate everything.\n  // Our satellites are plotted in ECI, so position them in ECI coords and rotate the globe by theta.\n  const theta = EARTH_ROT_PER_DAY * simTimeDays;\n  globeMesh.rotation.y = theta;\n  // Rotate graticule + coastlines + swath with the globe\n  for (const child of world.children) {\n    if (child === satGroup) continue;\n    child.rotation.y = theta;\n  }\n  // User drag rotation additional\n  world.rotation.y = userYaw;\n  world.rotation.x = userPitch;\n\n  // Globe auto-spin (presentation), applied via additional group rotation\n  const spinDelta = dtReal * 0.05 * window.__TWEAKS.globeSpinSpeed;\n  userYaw += spinDelta;\n\n  // Position satellites in ECI\n  const activeSats = getActiveSats();\n  satMeshes.forEach((m, i) => {\n    const active = activeSats.includes(i);\n    m.group.visible = active;\n    m.nadirLine.visible = active;\n    if (!active) return;\n    const eci = satellitePosECI(simTimeDays, sats[i].raan0, sats[i].phase0);\n    const pos = new THREE.Vector3(\n      eci[0] / R_EARTH * R_VIS,\n       eci[2] / R_EARTH * R_VIS,\n      -eci[1] / R_EARTH * R_VIS\n    );\n    // Map ECI (x vernal, y, z polar) to our scene (x, y up, z) — our latlonToVec3 uses (y up, -z for +lon sin)\n    // Actually our latlonToVec3 uses (cos(lat)cos(lon), sin(lat), -cos(lat)sin(lon)). In ECI z is polar.\n    // Straightforward mapping: scene.x = ECIx, scene.y = ECIz, scene.z = -ECIy\n    m.group.position.copy(pos);\n\n    // Nadir line: from sat to sub-point\n    const sub = groundTrackLatLon(simTimeDays, sats[i].raan0, sats[i].phase0);\n    const subV = latlonToVec3(sub.lat, sub.lon, R_VIS * 1.001);\n    // subV is in the rotated globe frame; we need ECI for the line since sat is in ECI.\n    // Un-rotate by theta: sub in ECI = rotY(subV, +theta)\n    const cT = Math.cos(theta), sT = Math.sin(theta);\n    const sxE = subV.x*cT + subV.z*sT;\n    const szE = -subV.x*sT + subV.z*cT;\n    const subECI = new THREE.Vector3(sxE, subV.y, szE);\n\n    const posAttr = m.nadirLine.geometry.attributes.position;\n    posAttr.array[0] = pos.x; posAttr.array[1] = pos.y; posAttr.array[2] = pos.z;\n    posAttr.array[3] = subECI.x; posAttr.array[4] = subECI.y; posAttr.array[5] = subECI.z;\n    posAttr.needsUpdate = true;\n  });\n\n  // Update HUD\n  updateHUD();\n}\n\nfunction getActiveSats() {\n  const n = window.__TWEAKS.satCount;\n  if (n === 1) return [0];\n  if (n === 2) return [0,1];\n  return [0,1,2];\n}\n\nfunction updateHUD() {\n  const simDate = new Date(EPOCH.getTime() + simTimeDays * 86400e3);\n  const ms = simDate.toISOString();\n  document.getElementById('date-str').textContent =\n    simDate.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'2-digit', timeZone:'UTC' }).toUpperCase();\n  const dayN = Math.floor(simTimeDays) + 1;\n  document.getElementById('day-str').textContent = `DAY ${String(Math.min(dayN,8)).padStart(2,'0')} / 8`;\n  const hh = ms.substring(11,13);\n  const mm = ms.substring(14,16);\n  const ss = ms.substring(17,19);\n  document.getElementById('utc-str').textContent = `${hh}:${mm}:${ss} UTC`;\n\n  const pct = covWeightedTotal > 0 ? (covWeightedPainted / covWeightedTotal) * 100 : 0;\n  coverageLandPct = pct;\n  const pctStr = pct.toFixed(1);\n  const el = document.getElementById('cov-pct');\n  el.innerHTML = `${pctStr}<span style=\"font-size:14px; color: var(--ink-dim); margin-left: 2px;\">%<\u002Fspan>`;\n  document.getElementById('cov-bar').style.width = `${Math.min(100, pct)}%`;\n\n  const orbits = simTimeDays * 1440 / PERIOD_MIN;\n  document.getElementById('total-orbits').textContent = Math.floor(orbits).toString();\n\n  // scrubber fill\n  const pctTime = simTimeDays / SIM_DAYS;\n  document.getElementById('scrub-fill').style.width = `${pctTime*100}%`;\n  document.getElementById('scrub-thumb').style.left = `${pctTime*100}%`;\n}\n\n// ============================================================\n// User interaction: drag to rotate\n// ============================================================\nlet userYaw = 0.3, userPitch = -0.2;\nlet dragging = false;\nlet lastX = 0, lastY = 0;\n\ncanvas.addEventListener('pointerdown', (e) => {\n  dragging = true; lastX = e.clientX; lastY = e.clientY;\n  canvas.setPointerCapture(e.pointerId);\n});\ncanvas.addEventListener('pointerup', (e) => { dragging = false; });\ncanvas.addEventListener('pointermove', (e) => {\n  if (!dragging) return;\n  const dx = e.clientX - lastX, dy = e.clientY - lastY;\n  userYaw += dx * 0.005;\n  userPitch += dy * 0.005;\n  userPitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, userPitch));\n  lastX = e.clientX; lastY = e.clientY;\n});\n\n// ============================================================\n// Legend rows\n// ============================================================\nfunction rebuildLegend() {\n  const host = document.getElementById('legend-rows');\n  host.innerHTML = '';\n  const active = getActiveSats();\n  const colors = [window.__TWEAKS.s2bColor, window.__TWEAKS.s2aColor, sats[2].color];\n  active.forEach(i => {\n    const row = document.createElement('div');\n    row.className = 'legend-row';\n    row.innerHTML = `\n      <div class=\"legend-swatch\" style=\"background:${colors[i]}; box-shadow: 0 0 6px ${colors[i]}\"><\u002Fdiv>\n      <div class=\"legend-label\">${sats[i].id}<\u002Fdiv>\n      <div class=\"legend-meta\">${i===0?'B':i===1?'A':'C'}<\u002Fdiv>\n    `;\n    host.appendChild(row);\n  });\n}\n\n// ============================================================\n// Scrubber & transport\n// ============================================================\n(function setupTicks() {\n  const ticks = document.getElementById('ticks');\n  for (let d=0; d<=8; d++) {\n    const t = document.createElement('div');\n    t.className = 'tick' + (d % 2 === 0 ? ' major' : '');\n    t.style.left = `${(d/8)*100}%`;\n    ticks.appendChild(t);\n  }\n})();\n\nconst scrubber = document.getElementById('scrubber');\nlet scrubbing = false;\nfunction updateScrubFromEvent(e) {\n  const r = scrubber.getBoundingClientRect();\n  const x = Math.max(0, Math.min(r.width, e.clientX - r.left));\n  const newT = Math.max(0, Math.min(SIM_DAYS, (x/r.width) * SIM_DAYS));\n  scrubTo(newT);\n}\n\n// Re-paint the canvas so it reflects exactly [0, target] of coverage for each active satellite.\nfunction scrubTo(target) {\n  // If scrubbing backwards or the heads are ahead, rewind by clearing and replaying from 0.\n  const needsRewind = lastPaintDays.some((d, i) => d !== null && d > target + 1e-9)\n                   || lastPaintDays.every(d => d === null);\n  if (needsRewind) {\n    sctx.clearRect(0, 0, SWATH_CANVAS_W, SWATH_CANVAS_H);\n    swathTex.needsUpdate = true;\n    for (let i=0; i<covGrid.length; i++) covGrid[i] = 0;\n    covWeightedPainted = 0;\n    for (let i=0; i<lastSub.length; i++) { lastSub[i] = null; lastPaintDays[i] = 0; }\n  }\n  simTimeDays = target;\n  // Catch up deterministically at 1-min step\n  const STEP_DAYS = 1.0 / 1440;\n  const activeSats = getActiveSats();\n  for (let sIdx of activeSats) {\n    if (lastPaintDays[sIdx] === null) lastPaintDays[sIdx] = 0;\n    if (lastSub[sIdx] === null) {\n      lastSub[sIdx] = groundTrackLatLon(lastPaintDays[sIdx], sats[sIdx].raan0, sats[sIdx].phase0);\n    }\n    while (lastPaintDays[sIdx] < target - 1e-9) {\n      const tk = Math.min(target, lastPaintDays[sIdx] + STEP_DAYS);\n      const pt = groundTrackLatLon(tk, sats[sIdx].raan0, sats[sIdx].phase0);\n      const col = (sIdx===0) ? window.__TWEAKS.s2bColor\n                : (sIdx===1) ? window.__TWEAKS.s2aColor\n                : sats[2].color;\n      if (window.__TWEAKS.showSwath) paintSwathSegment(sIdx, lastSub[sIdx], pt, col, tk);\n      lastSub[sIdx] = pt;\n      lastPaintDays[sIdx] = tk;\n    }\n  }\n}\nscrubber.addEventListener('pointerdown', (e) => {\n  scrubbing = true; scrubber.setPointerCapture(e.pointerId); updateScrubFromEvent(e);\n});\nscrubber.addEventListener('pointermove', (e) => { if (scrubbing) updateScrubFromEvent(e); });\nscrubber.addEventListener('pointerup', (e) => { scrubbing = false; });\n\nconst btnPlay = document.getElementById('btn-play');\nfunction updatePlayBtn() { btnPlay.textContent = playing ? 'PAUSE' : (simTimeDays >= SIM_DAYS ? 'REPLAY' : 'PLAY'); }\nbtnPlay.addEventListener('click', () => {\n  if (simTimeDays >= SIM_DAYS) {\n    // reset\n    simTimeDays = 0;\n    sctx.clearRect(0,0,SWATH_CANVAS_W,SWATH_CANVAS_H);\n    swathTex.needsUpdate = true;\n    for (let i=0; i<lastSub.length; i++) { lastSub[i] = null; lastPaintDays[i] = null; }\n    for (let i=0; i<covGrid.length; i++) covGrid[i] = 0;\n    covWeightedPainted = 0;\n  }\n  playing = !playing;\n  updatePlayBtn();\n});\n\nconst speedInput = document.getElementById('speed');\nconst speedVal = document.getElementById('speed-val');\nspeedInput.addEventListener('input', () => {\n  speed = parseFloat(speedInput.value);\n  speedVal.textContent = `${speed.toFixed(1)}×`;\n});\nspeed = parseFloat(speedInput.value);\nspeedVal.textContent = `${speed.toFixed(1)}×`;\n\n// ============================================================\n// Tweaks\n// ============================================================\n(function setupTweaks() {\n  const host = document.getElementById('tweaks');\n\n  // Sat count\n  document.querySelectorAll('#sat-count button').forEach(b => {\n    b.addEventListener('click', () => {\n      document.querySelectorAll('#sat-count button').forEach(x => x.classList.remove('on'));\n      b.classList.add('on');\n      const v = parseInt(b.dataset.v, 10);\n      window.__TWEAKS.satCount = v;\n      window.parent.postMessage({type: '__edit_mode_set_keys', edits: { satCount: v }}, '*');\n      rebuildLegend();\n    });\n  });\n  // initial state\n  document.querySelectorAll('#sat-count button').forEach(b => {\n    if (parseInt(b.dataset.v,10) === window.__TWEAKS.satCount) b.classList.add('on');\n    else b.classList.remove('on');\n  });\n\n  // Swatches\n  const palette = ['#5be3ff','#7ef59e','#ff8a3d','#ff5a8a','#b478ff','#ffd54d','#ffffff'];\n  function buildSwatches(hostId, key) {\n    const host = document.getElementById(hostId);\n    host.innerHTML = '';\n    palette.forEach(c => {\n      const s = document.createElement('div');\n      s.className = 'swatch';\n      s.style.background = c;\n      s.style.boxShadow = `0 0 6px ${c}`;\n      if (window.__TWEAKS[key] === c) s.classList.add('on');\n      s.addEventListener('click', () => {\n        window.__TWEAKS[key] = c;\n        host.querySelectorAll('.swatch').forEach(x => x.classList.remove('on'));\n        s.classList.add('on');\n        window.parent.postMessage({type: '__edit_mode_set_keys', edits: { [key]: c }}, '*');\n        rebuildLegend();\n        applySatColors();\n      });\n      host.appendChild(s);\n    });\n  }\n  buildSwatches('s2a-swatches', 's2aColor');\n  buildSwatches('s2b-swatches', 's2bColor');\n\n  // Swath toggle\n  document.querySelectorAll('#swath-toggle button').forEach(b => {\n    b.addEventListener('click', () => {\n      document.querySelectorAll('#swath-toggle button').forEach(x => x.classList.remove('on'));\n      b.classList.add('on');\n      const v = parseInt(b.dataset.v,10);\n      window.__TWEAKS.showSwath = !!v;\n      swathMesh.visible = !!v;\n      window.parent.postMessage({type: '__edit_mode_set_keys', edits: { showSwath: !!v }}, '*');\n    });\n  });\n  document.querySelectorAll('#swath-toggle button').forEach(b => {\n    b.classList.toggle('on', (!!parseInt(b.dataset.v,10)) === window.__TWEAKS.showSwath);\n  });\n\n  // Spin speed\n  const spin = document.getElementById('spin-speed');\n  spin.value = window.__TWEAKS.globeSpinSpeed;\n  spin.addEventListener('input', () => {\n    const v = parseFloat(spin.value);\n    window.__TWEAKS.globeSpinSpeed = v;\n    window.parent.postMessage({type: '__edit_mode_set_keys', edits: { globeSpinSpeed: v }}, '*');\n  });\n\n  // Host toggle wire-up\n  window.addEventListener('message', (e) => {\n    if (!e.data || !e.data.type) return;\n    if (e.data.type === '__activate_edit_mode') host.classList.add('on');\n    if (e.data.type === '__deactivate_edit_mode') host.classList.remove('on');\n  });\n  window.parent.postMessage({type: '__edit_mode_available'}, '*');\n})();\n\nrebuildLegend();\nupdatePlayBtn();\n\n// Keep the 3D satellite markers (dot, halo, nadir line) in sync with tweak colors.\nfunction applySatColors() {\n  const cols = [window.__TWEAKS.s2bColor, window.__TWEAKS.s2aColor, sats[2].color];\n  satMeshes.forEach((m, i) => {\n    const c = new THREE.Color(cols[i]);\n    m.dotMat.color.copy(c);\n    if (m.haloMat.uniforms && m.haloMat.uniforms.uColor) m.haloMat.uniforms.uColor.value.copy(c);\n    m.nadirLine.material.color.copy(c);\n    sats[i].color = cols[i];\n  });\n}\napplySatColors();\n\n// ============================================================\n// Resize & render loop\n// ============================================================\nfunction onResize() {\n  const w = window.innerWidth, h = window.innerHeight;\n  renderer.setSize(w, h);\n  camera.aspect = w/h;\n  camera.updateProjectionMatrix();\n}\nwindow.addEventListener('resize', onResize);\nonResize();\n\n// ============================================================\n// Sun indicator — project the ECI sun direction to screen,\n// clamp to viewport edge, and flip label side if clamped.\n// ============================================================\nconst sunEl = document.getElementById('sun-indicator');\nconst _sunV = new THREE.Vector3();\nconst _sunWorld = new THREE.Vector3();\nfunction updateSunIndicator() {\n  // Subsolar ECEF point: lon = 180 - 15*utcHours, lat = 0\n  const utcHours = (simTimeDays * 24) % 24;\n  const sunLonDeg = 180 - 15 * utcHours;\n  const lonRad = sunLonDeg * Math.PI/180;\n  // ECEF unit vector (lat=0): match our (lat,lon)→xyz convention used elsewhere.\n  _sunV.set(Math.cos(lonRad), 0, -Math.sin(lonRad));\n  // ECEF → ECI: rotate by +theta around Y\n  const theta = EARTH_ROT_PER_DAY * simTimeDays;\n  const cx = Math.cos(theta), sx = Math.sin(theta);\n  const vx = _sunV.x * cx + _sunV.z * sx;\n  const vz = -_sunV.x * sx + _sunV.z * cx;\n  _sunWorld.set(vx * 8, 0, vz * 8);\n  _sunWorld.applyMatrix4(world.matrixWorld);\n  const ndc = _sunWorld.clone().project(camera);\n  const w = window.innerWidth, h = window.innerHeight;\n  const sx_px = (ndc.x * 0.5 + 0.5) * w;\n  const sy_px = (-ndc.y * 0.5 + 0.5) * h;\n  const behind = ndc.z > 1;\n  const margin = 80;\n  const cxp = w/2, cyp = h/2;\n  let dx = sx_px - cxp, dy = sy_px - cyp;\n  if (behind) { dx = -dx; dy = -dy; }\n  const maxX = w/2 - margin, maxY = h/2 - margin;\n  const scaleX = Math.abs(dx) > maxX ? maxX / Math.abs(dx) : 1;\n  const scaleY = Math.abs(dy) > maxY ? maxY / Math.abs(dy) : 1;\n  const s = Math.min(scaleX, scaleY);\n  if (behind || Math.abs(dx) > maxX || Math.abs(dy) > maxY) { dx *= s; dy *= s; }\n  const finalX = cxp + dx, finalY = cyp + dy;\n  sunEl.style.left = finalX + 'px';\n  sunEl.style.top  = finalY + 'px';\n  sunEl.classList.toggle('on-right', finalX > w/2);\n}\n\nfunction tick() {\n  const dt = Math.min(0.1, clock.getDelta());\n  update(dt);\n  updateSunIndicator();\n  renderer.render(scene, camera);\n  requestAnimationFrame(tick);\n}\ntick();\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
